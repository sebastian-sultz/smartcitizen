version: '3.8'

services:
  frontend:
    image: ghcr.io/sebastian-sultz/smartcitizen-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.globalsmartcitizensfoundation.org/api
    container_name: global-smart-citizen-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

  backend:
    image: ghcr.io/sebastian-sultz/smartcitizen-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: global-smart-citizen-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:8080:8080"
