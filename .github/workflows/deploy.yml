name: Deploy Global Smart Citizen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # 1. CI Validation & Docker Image Build
  build-and-push:
    name: Build & Push Docker Images to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Backend Build & Push
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/sebastian-sultz/smartcitizen-backend:latest
          cache-from: type=registry,ref=ghcr.io/sebastian-sultz/smartcitizen-backend:latest
          cache-to: type=inline

      # Frontend Build & Push
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.globalsmartcitizensfoundation.org/api
          tags: ghcr.io/sebastian-sultz/smartcitizen-frontend:latest
          cache-from: type=registry,ref=ghcr.io/sebastian-sultz/smartcitizen-frontend:latest
          cache-to: type=inline

  # 2. CD Deployment (Instant Pull on EC2)
  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          envs: GITHUB_TOKEN,GITHUB_ACTOR

          script: |
            set -e

            echo "========================================="
            echo "Starting Global Smart Citizen deployment"
            echo "========================================="

            cd /opt/global-smart-citizen/smartcitizen

            echo "Fetching latest repository code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Authenticating Docker with GHCR..."
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            echo "Pulling pre-built Docker images from GHCR..."
            docker compose pull

            echo "Restarting containers with zero downtime..."
            docker compose up -d --remove-orphans

            echo "Cleaning up unused Docker images..."
            docker image prune -f

            echo "Checking running containers..."
            docker compose ps

            echo "========================================="
            echo "Global Smart Citizen deployment completed successfully!"
            echo "========================================="
