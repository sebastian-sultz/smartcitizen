name: Deploy Global Smart Citizen

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # 1. CI Validation
  build-and-test:
    name: Build & Test Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      # Backend - Go
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify Backend Build
        working-directory: backend
        run: |
          go build ./...

      # Frontend - Next.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Frontend Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.globalsmartcitizensfoundation.org/api
        run: |
          npm ci
          npm run build

  # 2. CD Deployment
  deploy:
    name: Deploy to AWS EC2
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 30m

          script: |
            set -e

            echo "========================================="
            echo "Starting Global Smart Citizen deployment"
            echo "========================================="

            cd /opt/global-smart-citizen/smartcitizen

            echo "Fetching latest code..."
            git fetch origin main

            echo "Resetting to latest main branch..."
            git reset --hard origin/main

            echo "Rebuilding and restarting containers..."
            docker compose up -d --build

            echo "Removing unused Docker images..."
            docker image prune -f

            echo "Checking running containers..."
            docker compose ps

            echo "========================================="
            echo "Global Smart Citizen deployment completed successfully!"
            echo "========================================="